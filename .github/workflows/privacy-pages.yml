name: Privacy policy Pages

on:
  push:
    branches: [main]
    paths: [docs/privacy-policy.html, .github/workflows/privacy-pages.yml]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: petworld-privacy-pages
  cancel-in-progress: false

jobs:
  deploy:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Prepare public policy only
        run: |
          mkdir public-policy
          cp docs/privacy-policy.html public-policy/privacy-policy.html
          cp docs/privacy-policy.html public-policy/index.html
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: public-policy
      - name: Publish privacy policy
        id: deployment
        uses: actions/deploy-pages@v4
