name: Android CI

on:
  push:
    branches:
      - main
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 35

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          ref: ${{ github.head_ref || github.ref_name }}

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '9.5.0'

      - name: Install Android platform
        run: |
          SDK_ROOT="${ANDROID_HOME:-${ANDROID_SDK_ROOT:-/usr/local/lib/android/sdk}}"
          SDK_MANAGER="$(find "$SDK_ROOT/cmdline-tools" -path '*/bin/sdkmanager' -type f | head -n 1)"
          test -n "$SDK_MANAGER"
          "$SDK_MANAGER" --sdk_root="$SDK_ROOT" --install "platforms;android-37.0" "build-tools;36.0.0"
          echo "ANDROID_HOME=$SDK_ROOT" >> "$GITHUB_ENV"

      - name: Verify Gradle wrapper
        run: |
          echo "497c8c2a7e5031f6aa847f88104aa80a93532ec32ee17bdb8d1d2f67a194a9c7  gradle/wrapper/gradle-wrapper.jar" | sha256sum --check

      - name: Unit tests
        run: ./gradlew :app:testDebugUnitTest --no-daemon --stacktrace

      - name: Android lint
        run: ./gradlew :app:lintDebug --no-daemon --stacktrace

      - name: Assemble debug
        run: ./gradlew :app:assembleDebug --no-daemon --stacktrace

      - name: Verify isolated Firebase development APK
        run: |
          mkdir -p app/src/firebaseDev
          cat > app/src/firebaseDev/google-services.json <<'JSON'
          {
            "project_info": {"project_number": "1234567890", "project_id": "demo-petworld-fb01"},
            "client": [{
              "client_info": {
                "mobilesdk_app_id": "1:1234567890:android:0000000000000000",
                "android_client_info": {"package_name": "com.haebi.petworld.dev"}
              },
              "api_key": [{"current_key": "fake-ci-key"}],
              "oauth_client": [{"client_type": 3, "client_id": "ci-dev-web-client.example"}]
            }],
            "configuration_version": "1"
          }
          JSON
          mkdir -p app/src/release
          cat > app/src/release/google-services.json <<'JSON'
          {
            "project_info": {"project_number": "1234567891", "project_id": "demo-petworld-prod"},
            "client": [{
              "client_info": {
                "mobilesdk_app_id": "1:1234567891:android:0000000000000001",
                "android_client_info": {"package_name": "com.haebi.petworld"}
              },
              "api_key": [{"current_key": "fake-ci-key"}],
              "oauth_client": [{"client_type": 3, "client_id": "ci-prod-web-client.example"}]
            }],
            "configuration_version": "1"
          }
          JSON
          python3 -m unittest discover -s scripts -p 'test_fb02_android_config_guard.py' -v
          python3 scripts/firebase/android_config_guard.py --ci-demo \
            --dev app/src/firebaseDev/google-services.json \
            --prod app/src/release/google-services.json
          ./gradlew :app:assembleDebug :app:assembleFirebaseDev --no-daemon --stacktrace
          AAPT2="$ANDROID_HOME/build-tools/36.0.0/aapt2"
          DEBUG_APK="app/build/outputs/apk/debug/app-debug.apk"
          DEV_APK="$(find app/build/outputs/apk -iname '*firebasedev*.apk' -type f -print -quit)"
          test -n "$DEV_APK"
          "$AAPT2" dump badging "$DEBUG_APK" | grep -F "package: name='com.haebi.petworld'"
          "$AAPT2" dump badging "$DEV_APK" | grep -F "package: name='com.haebi.petworld.dev'"
          "$AAPT2" dump resources "$DEV_APK" | grep -F 'demo-petworld-fb01'
          "$AAPT2" dump resources "$DEBUG_APK" > "$RUNNER_TEMP/petworld-debug-resources.txt"
          if grep -Fq 'demo-petworld-fb01' "$RUNNER_TEMP/petworld-debug-resources.txt"; then
            exit 1
          fi
