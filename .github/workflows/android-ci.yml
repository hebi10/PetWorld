name: Android CI

on:
  push:
    branches:
      - main
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 35

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '9.5.0'

      - name: Install Android platform
        run: |
          SDK_ROOT="${ANDROID_HOME:-${ANDROID_SDK_ROOT:-/usr/local/lib/android/sdk}}"
          SDK_MANAGER="$(find "$SDK_ROOT/cmdline-tools" -path '*/bin/sdkmanager' -type f | head -n 1)"
          test -n "$SDK_MANAGER"
          "$SDK_MANAGER" --sdk_root="$SDK_ROOT" --install "platforms;android-37.0" "build-tools;36.0.0"
          echo "ANDROID_HOME=$SDK_ROOT" >> "$GITHUB_ENV"

      - name: Verify Gradle wrapper
        run: |
          echo "497c8c2a7e5031f6aa847f88104aa80a93532ec32ee17bdb8d1d2f67a194a9c7  gradle/wrapper/gradle-wrapper.jar" | sha256sum --check

      - name: Unit tests
        run: ./gradlew :app:testDebugUnitTest --no-daemon --stacktrace

      - name: Android lint
        run: ./gradlew :app:lintDebug --no-daemon --stacktrace

      - name: Assemble debug
        run: ./gradlew :app:assembleDebug --no-daemon --stacktrace

      - name: Verify isolated development and release Firebase configuration
        run: |
          python3 scripts/firebase/prepare_android_config.py firebaseDev
          python3 scripts/firebase/prepare_android_config.py release
          ./gradlew :app:assembleDebug :app:assembleFirebaseDev --no-daemon --stacktrace
          RELEASE_TEST_KEYSTORE="$RUNNER_TEMP/petworld-firebase-config-ci.p12"
          trap 'rm -f "$RELEASE_TEST_KEYSTORE"' EXIT
          keytool -genkeypair -storetype PKCS12 -keystore "$RELEASE_TEST_KEYSTORE" \
            -alias firebase-config-ci -keyalg RSA -keysize 2048 -validity 1 \
            -dname "CN=PetWorld Firebase config CI" -storepass android -keypass android
          ANDROID_RELEASE_KEYSTORE_PATH="$RELEASE_TEST_KEYSTORE" \
            ANDROID_RELEASE_STORE_PASSWORD=android \
            ANDROID_RELEASE_KEY_ALIAS=firebase-config-ci \
            ANDROID_RELEASE_KEY_PASSWORD=android \
            ./gradlew :app:assembleRelease --no-daemon --stacktrace

          AAPT2="$ANDROID_HOME/build-tools/36.0.0/aapt2"
          DEBUG_APK="app/build/outputs/apk/debug/app-debug.apk"
          DEV_APK="$(find app/build/outputs/apk -iname '*firebasedev*.apk' -type f -print -quit)"
          RELEASE_APK="app/build/outputs/apk/release/app-release.apk"
          test -n "$DEV_APK"
          "$AAPT2" dump badging "$DEBUG_APK" > "$RUNNER_TEMP/petworld-debug-badging.txt"
          "$AAPT2" dump badging "$DEV_APK" > "$RUNNER_TEMP/petworld-dev-badging.txt"
          "$AAPT2" dump badging "$RELEASE_APK" > "$RUNNER_TEMP/petworld-release-badging.txt"
          grep -Fq "package: name='com.haebi.petworld'" "$RUNNER_TEMP/petworld-release-badging.txt"
          grep -Fq "package: name='com.haebi.petworld'" "$RUNNER_TEMP/petworld-debug-badging.txt"
          grep -Fq "package: name='com.haebi.petworld.dev'" "$RUNNER_TEMP/petworld-dev-badging.txt"
          "$AAPT2" dump resources "$DEBUG_APK" > "$RUNNER_TEMP/petworld-debug-resources.txt"
          "$AAPT2" dump resources "$DEV_APK" > "$RUNNER_TEMP/petworld-dev-resources.txt"
          "$AAPT2" dump resources "$RELEASE_APK" > "$RUNNER_TEMP/petworld-release-resources.txt"
          grep -Fq 'petworld-dev' "$RUNNER_TEMP/petworld-dev-resources.txt"
          grep -Fq 'petworld-prod-3b5c5' "$RUNNER_TEMP/petworld-release-resources.txt"
          if grep -Eq 'petworld-dev|petworld-prod-3b5c5' "$RUNNER_TEMP/petworld-debug-resources.txt" \
            || grep -Fq 'petworld-prod-3b5c5' "$RUNNER_TEMP/petworld-dev-resources.txt" \
            || grep -Fq 'petworld-dev' "$RUNNER_TEMP/petworld-release-resources.txt"; then
            echo "::error::Firebase configuration crossed build variants."
            exit 1
          fi

          cp app/src/firebaseDev/google-services.json app/src/release/google-services.json
          if ./gradlew :app:help --no-daemon > "$RUNNER_TEMP/petworld-swapped-config.txt" 2>&1; then
            echo "::error::Gradle accepted the development Firebase project for release."
            exit 1
          fi
          grep -Fq 'release/google-services.json must use Firebase project petworld-prod-3b5c5' \
            "$RUNNER_TEMP/petworld-swapped-config.txt"

  firebase-dev-integration:
    if: >-
      github.event_name == 'workflow_dispatch' &&
      github.ref == 'refs/heads/feature/fb-02-a-firebase-integration'
    uses: ./.github/workflows/firebase-dev-signing.yml
    with:
      branch_validation: true
    secrets:
      PETWORLD_DEV_KEYSTORE_BASE64: ${{ secrets.PETWORLD_DEV_KEYSTORE_BASE64 }}
      PETWORLD_DEV_STORE_PASSWORD: ${{ secrets.PETWORLD_DEV_STORE_PASSWORD }}
      PETWORLD_DEV_KEY_ALIAS: ${{ secrets.PETWORLD_DEV_KEY_ALIAS }}
      PETWORLD_DEV_KEY_PASSWORD: ${{ secrets.PETWORLD_DEV_KEY_PASSWORD }}
      PETWORLD_DEV_GOOGLE_SERVICES_JSON_BASE64: ${{ secrets.PETWORLD_DEV_GOOGLE_SERVICES_JSON_BASE64 }}
