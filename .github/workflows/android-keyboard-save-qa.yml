name: Android Keyboard Save Accessibility QA

on:
  pull_request:
    paths:
      - 'app/src/main/**'
      - 'app/src/androidTest/**'
      - '.github/scripts/capture-petworld-keyboard.sh'
      - '.github/workflows/android-keyboard-save-qa.yml'
  workflow_dispatch:

concurrency:
  group: petworld-${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  keyboard-save:
    name: Keyboard save / ${{ matrix.mode }}
    runs-on: ubuntu-latest
    timeout-minutes: 65
    strategy:
      fail-fast: false
      matrix:
        mode: [normal, compact-360dp-font160]
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          ref: ${{ github.head_ref || github.ref_name }}
      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '9.5.0'
      - name: Install Android platform
        run: |
          SDK_ROOT="${ANDROID_HOME:-${ANDROID_SDK_ROOT:-/usr/local/lib/android/sdk}}"
          SDK_MANAGER="$(find "$SDK_ROOT/cmdline-tools" -path '*/bin/sdkmanager' -type f | head -n 1)"
          test -n "$SDK_MANAGER"
          "$SDK_MANAGER" --sdk_root="$SDK_ROOT" --install "platforms;android-37.0" "build-tools;36.0.0"
          echo "ANDROID_HOME=$SDK_ROOT" >> "$GITHUB_ENV"
      - name: Build Android app and instrumentation APK
        run: ./gradlew :app:assembleDebug :app:assembleDebugAndroidTest --no-daemon --stacktrace
      - name: Enable KVM
        run: |
          if [ -e /dev/kvm ]; then sudo chmod 666 /dev/kvm; fi
      - name: Verify keyboard and sticky save action
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 35
          arch: x86_64
          target: google_apis
          profile: pixel_6
          disable-animations: true
          emulator-boot-timeout: 600
          script: |
            if [ "${{ matrix.mode }}" = "compact-360dp-font160" ]; then
              adb shell wm size 720x1600
              adb shell wm density 320
              adb shell settings put system font_scale 1.6
            fi
            bash .github/scripts/capture-petworld-keyboard.sh ${{ matrix.mode }}
      - name: Upload keyboard screenshots and diagnostics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: petworld-ui06e-keyboard-${{ matrix.mode }}
          path: qa/keyboard/${{ matrix.mode }}/
          if-no-files-found: warn
