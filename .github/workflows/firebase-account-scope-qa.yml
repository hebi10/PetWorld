name: PetWorld FB-03 scoped data isolation QA

on:
  pull_request:
    paths:
      - 'app/src/main/java/com/haebi/petworld/data/**'
      - 'app/src/main/java/com/haebi/petworld/MainActivity.kt'
      - 'app/src/main/java/com/haebi/petworld/MainViewModel.kt'
      - 'app/src/firebaseDev/**'
      - 'app/src/androidTest/java/com/haebi/petworld/AccountScopedIsolationDeviceTest.kt'
      - '.github/workflows/firebase-account-scope-qa.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  local-account-isolation:
    name: Room guest/A/B isolated - API ${{ matrix.api }}
    runs-on: ubuntu-latest
    timeout-minutes: 55
    strategy:
      fail-fast: false
      matrix:
        api: [29, 35, 36]
    steps:
      - name: Checkout exact PR commit
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          persist-credentials: false

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '9.5.0'

      - name: Install required Android platforms
        run: |
          SDK_ROOT="${ANDROID_HOME:-${ANDROID_SDK_ROOT:-/usr/local/lib/android/sdk}}"
          SDK_MANAGER="$(find "$SDK_ROOT/cmdline-tools" -path '*/bin/sdkmanager' -type f | head -n 1)"
          test -n "$SDK_MANAGER"
          "$SDK_MANAGER" --sdk_root="$SDK_ROOT" --install "platforms;android-37.0" "build-tools;36.0.0"
          echo "ANDROID_HOME=$SDK_ROOT" >> "$GITHUB_ENV"

      - name: Build local-only debug and test APKs
        run: ./gradlew :app:assembleDebug :app:assembleDebugAndroidTest --no-daemon --stacktrace

      - name: Enable KVM
        run: |
          if [ -e /dev/kvm ]; then sudo chmod 666 /dev/kvm; fi

      - name: Run account-isolation device verification
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: ${{ matrix.api }}
          arch: x86_64
          target: google_apis
          profile: pixel_6
          disable-animations: true
          emulator-boot-timeout: 600
          script: ./gradlew :app:connectedDebugAndroidTest -Pandroid.testInstrumentationRunnerArguments.class=com.haebi.petworld.AccountScopedIsolationDeviceTest --no-daemon --stacktrace

      - name: Upload scoped isolation QA result
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: petworld-fb03-scope-api-${{ matrix.api }}
          path: |
            app/build/reports/androidTests/connected/
            app/build/outputs/androidTest-results/connected/
          if-no-files-found: warn
