name: Android Settings and Profile Manager UI QA

on:
  pull_request:
    paths:
      - 'app/src/main/java/com/haebi/petworld/ui/screens/PetHomeAndManager.kt'
      - 'app/src/main/java/com/haebi/petworld/ui/PetWorldNavigation.kt'
      - 'app/src/main/java/com/haebi/petworld/ui/screens/PetBackupSection.kt'
      - 'app/src/androidTest/java/com/haebi/petworld/PetWorldSettingsCaptureTest.kt'
      - '.github/scripts/capture-petworld-settings.sh'
      - '.github/workflows/android-settings-qa.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  settings:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          ref: ${{ github.head_ref || github.ref_name }}
      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '9.5.0'
      - name: Install Android platform
        run: |
          SDK_ROOT="${ANDROID_HOME:-${ANDROID_SDK_ROOT:-/usr/local/lib/android/sdk}}"
          SDK_MANAGER="$(find "$SDK_ROOT/cmdline-tools" -path '*/bin/sdkmanager' -type f | head -n 1)"
          test -n "$SDK_MANAGER"
          "$SDK_MANAGER" --sdk_root="$SDK_ROOT" --install "platforms;android-37.0" "build-tools;36.0.0"
          echo "ANDROID_HOME=$SDK_ROOT" >> "$GITHUB_ENV"
      - name: Compile screenshot test
        run: ./gradlew :app:assembleDebug :app:assembleDebugAndroidTest --no-daemon --stacktrace
      - name: Enable KVM
        run: |
          if [ -e /dev/kvm ]; then sudo chmod 666 /dev/kvm; fi
      - name: Settings light/dark screenshots
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 35
          arch: x86_64
          target: google_apis
          profile: pixel_6
          disable-animations: true
          emulator-boot-timeout: 600
          script: bash .github/scripts/capture-petworld-settings.sh
      - name: Upload screenshots and failure diagnostics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: petworld-ui04-settings-light-dark
          path: qa/settings/
          if-no-files-found: warn
