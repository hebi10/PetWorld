name: PetWorld closed alpha preflight diagnostic

on:
  push:
    branches:
      - qa/closed-alpha-preflight-20261110

permissions:
  contents: read
  id-token: write

jobs:
  validate:
    runs-on: ubuntu-latest
    environment: google-play
    timeout-minutes: 10
    steps:
      - name: Checkout diagnostic branch
        uses: actions/checkout@v4
        with:
          fetch-depth: 2
          persist-credentials: false
      - name: Confirm diagnostic based on current trusted main
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          base="$(git rev-parse HEAD^)"
          current="$(gh api repos/hebi10/PetWorld/git/ref/heads/main --jq '.object.sha')"
          test "$base" = "$current"
          echo 'Diagnostic matches trusted main. No Play edit will be committed.'
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Check Google Play authentication
        id: credentials
        env:
          PLAY_WORKLOAD_IDENTITY_PROVIDER: ${{ vars.PLAY_WORKLOAD_IDENTITY_PROVIDER }}
          PLAY_SERVICE_ACCOUNT: ${{ vars.PLAY_SERVICE_ACCOUNT }}
          PLAY_SERVICE_ACCOUNT_JSON: ${{ secrets.PLAY_SERVICE_ACCOUNT_JSON }}
        run: python3 scripts/play/preflight.py auth
      - name: Authenticate using WIF
        id: wif
        if: steps.credentials.outputs.auth_mode == 'wif'
        uses: google-github-actions/auth@v3
        with:
          workload_identity_provider: ${{ vars.PLAY_WORKLOAD_IDENTITY_PROVIDER }}
          service_account: ${{ vars.PLAY_SERVICE_ACCOUNT }}
          token_format: access_token
          access_token_scopes: https://www.googleapis.com/auth/androidpublisher
          create_credentials_file: false
      - name: Authenticate using legacy JSON
        id: json
        if: steps.credentials.outputs.auth_mode == 'json'
        uses: google-github-actions/auth@v3
        with:
          credentials_json: ${{ secrets.PLAY_SERVICE_ACCOUNT_JSON }}
          token_format: access_token
          access_token_scopes: https://www.googleapis.com/auth/androidpublisher
          create_credentials_file: false
      - name: Validate existing version 3 for alpha without committing
        env:
          PLAY_ACCESS_TOKEN: ${{ steps.wif.outputs.access_token || steps.json.outputs.access_token }}
        shell: bash
        run: |
          python3 - <<'PY'
          import json
          import os
          import re
          import sys
          import urllib.error
          import urllib.parse
          import urllib.request

          PACKAGE = "com.haebi.petworld"
          BASE = f"https://androidpublisher.googleapis.com/androidpublisher/v3/applications/{PACKAGE}"
          token = os.environ.get("PLAY_ACCESS_TOKEN", "")
          if not token:
              sys.exit("Google Play access token missing")

          category_words = {
              "TESTER_CONFIGURATION": ("tester", "testing", "test group", "테스터"),
              "REVIEW_OR_PUBLISHING": ("review", "publish", "changesnotsentforreview", "심사"),
              "COUNTRY_TARGETING": ("country", "countries", "region"),
              "CONTENT_DECLARATION": ("privacy", "data safety", "declaration", "content", "policy"),
              "RELEASE_VERSION": ("versioncode", "version code", "release", "track", "bundle"),
              "LEGAL_CONSENT": ("consent", "terms", "legal"),
          }

          def request(stage, method, path, body=None):
              url = BASE + path
              payload = json.dumps(body).encode("utf-8") if body is not None else None
              headers = {"Authorization": "Bearer " + token}
              if payload is not None:
                  headers["Content-Type"] = "application/json; charset=utf-8"
              req = urllib.request.Request(url, data=payload, headers=headers, method=method)
              try:
                  with urllib.request.urlopen(req, timeout=60) as response:
                      raw = response.read()
                      return json.loads(raw) if raw else {}
              except urllib.error.HTTPError as exc:
                  try:
                      error_obj = json.loads(exc.read(65536)).get("error", {})
                  except (ValueError, OSError):
                      error_obj = {}
                  status = error_obj.get("status") or "UNSPECIFIED"
                  if not isinstance(status, str) or not re.fullmatch(r"[A-Z_]{1,64}",status):
                      status = "UNSPECIFIED"
                  reasons = []
                  for entry in error_obj.get("details", []):
                      if isinstance(entry, dict):
                          reason = entry.get("reason")
                          if isinstance(reason, str) and re.fullmatch(r"[A-Z_]{1,64}", reason):
                              reasons.append(reason)
                  message = str(error_obj.get("message", "")).lower()
                  categories = [name for name, words in category_words.items() if any(w in message for w in words)]
                  print(f"SAFE_PLAY_ERROR stage={stage} http={exc.code} status={status} reasons={','.join(reasons) or 'UNSPECIFIED'} categories={','.join(categories) or 'UNCLASSIFIED'}")
                  raise RuntimeError("Play request failed; raw message deliberately not logged") from None

          edit_id = None
          try:
              print("CHECK_BEGIN version=3 destination=alpha commit=false")
              edit_id = request("create_edit", "POST", "/edits", {})["id"]
              if not re.fullmatch(r"[0-9A-Za-z]+",str(edit_id)):
                  raise RuntimeError("Invalid edit identifier")
              edit = f"/edits/{edit_id}"
              internal = request("read_internal", "GET", edit + "/tracks/internal")
              releases = internal.get("releases",[])
              matched = [
                  r for r in releases
                  if r.get("status") == "completed" and "3" in [str(v) for v in r.get("versionCodes",[])]
              ]
              print(f"INTERNAL_VERSION_3_COMPLETED={bool(matched)}")
              if not matched:
                  raise RuntimeError("Requested version 3 is not a completed internal release")
              alpha = request("read_alpha", "GET", edit + "/tracks/alpha")
              print(f"ALPHA_TRACK_PRESENT={alpha.get('track') == 'alpha'}")
              print(f"ALPHA_RELEASE_COUNT={len(alpha.get('releases',[]))}")
              staged = {"track":"alpha","releases":[{"name":"0.1.0 (3)", "versionCodes":["3"],"status":"completed"}]}
              request("update_alpha", "PUT", edit + "/tracks/alpha",staged)
              print("ALPHA_UPDATE_STAGED=true")
              request("validate_alpha", "POST", edit + ":validate",{})
              print("ALPHA_EDIT_VALIDATION=success")
              print("NO_COMMIT_OR_PUBLISH_PERFORMED=true")
          finally:
              if edit_id:
                  try:
                      request("delete_edit","DELETE",f"/edits/{edit_id}")
                  except RuntimeError:
                      print("EDIT_CLEANUP=unable_to_verify")
          PY
