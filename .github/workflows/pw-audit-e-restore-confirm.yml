name: PetWorld D22 restore confirmation evidence
on:
  push:
    branches: [qa/pw-audit-01-e-restore-confirm-20261127]
    paths: ['.github/workflows/pw-audit-e-restore-confirm.yml']
permissions:
  contents: read
jobs:
  capture:
    if: github.repository == 'hebi10/PetWorld' && github.ref == 'refs/heads/qa/pw-audit-01-e-restore-confirm-20261127'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 2
          persist-credentials: false
      - name: Verify QA-only diff
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD^)" = "dc21b258f596e212d897c145f4c0fbc0ce6b386a"
          test "$(git diff --name-only HEAD^ HEAD | sort)" = "$(printf '%s\n' '.github/workflows/pw-audit-e-restore-confirm.yml' '.github/scripts/capture-petworld-restore-confirm.sh' 'app/src/androidTest/java/com/haebi/petworld/PetWorldRestoreConfirmCaptureTest.kt' | sort)"
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '9.5.0'
      - name: Install Android platform
        run: |
          SDK_ROOT="${ANDROID_HOME:-${ANDROID_SDK_ROOT:-/usr/local/lib/android/sdk}}"
          SDK_MANAGER="$(find "$SDK_ROOT/cmdline-tools" -path '*/bin/sdkmanager' -type f | head -n 1)"
          test -n "$SDK_MANAGER"
          "$SDK_MANAGER" --sdk_root="$SDK_ROOT" --install "platforms;android-37.0" "build-tools;36.0.0"
          echo "ANDROID_HOME=$SDK_ROOT" >> "$GITHUB_ENV"
      - name: Build exact product and additional QA test
        run: ./gradlew :app:assembleDebug :app:assembleDebugAndroidTest --no-daemon --stacktrace
      - name: Enable KVM
        run: |
          if [ -e /dev/kvm ]; then sudo chmod 666 /dev/kvm; fi
      - name: Synthetic backup restore warning capture
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 35
          arch: x86_64
          target: google_apis
          profile: pixel_6
          disable-animations: true
          emulator-boot-timeout: 600
          script: bash .github/scripts/capture-petworld-restore-confirm.sh
      - name: Upload evidence and diagnostics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: petworld-d22-restore-confirm
          path: qa/audit-e-restore/
          if-no-files-found: warn
