name: Firebase Rules CI

on:
  pull_request:
    paths:
      - firebase.json
      - firebase/**
      - scripts/firebase/**
      - .github/workflows/firebase-rules-ci.yml
  workflow_dispatch:

permissions:
  contents: read

jobs:
  rules:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout exact source
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Verify offline Firebase connection readiness
        run: node scripts/firebase/check-connection-readiness.mjs

      - name: Set up Java for emulators
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      - name: Check configuration and no real project binding
        run: |
          node --check firebase/test/rules.test.mjs
          node -e "const f=require('./firebase.json'); if(!f.firestore?.rules || !f.storage?.rules || !f.emulators?.firestore || !f.emulators?.storage) process.exit(1)"
          test ! -f .firebaserc
          test ! -f app/google-services.json

      - name: Install isolated rules-test dependencies
        run: npm install --prefix firebase --no-audit --no-fund

      - name: Exercise Firestore and Storage rules offline
        env:
          FIREBASE_CLI_DISABLE_TELEMETRY: '1'
        run: |
          ./firebase/node_modules/.bin/firebase emulators:exec \
            --project demo-petworld-fb01 \
            --only firestore,storage \
            --config firebase.json \
            --non-interactive \
            "npm --prefix firebase run test:rules"
