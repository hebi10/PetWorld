name: PetWorld UI-10-G API Compatibility and Data QA

on:
  pull_request:
    paths:
      - 'app/src/main/**'
      - 'app/src/androidTest/**'
      - 'app/src/test/**'
      - '.github/scripts/run-petworld-ui10g.sh'
      - '.github/workflows/android-ui10g-integration-qa.yml'
  workflow_dispatch:

concurrency:
  group: petworld-ui10g-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  cross-api:
    if: github.event_name == 'workflow_dispatch' || startsWith(github.head_ref, 'qa/ui-10g-')
    name: Android API ${{ matrix.api_level }} (records + backup)
    runs-on: ubuntu-latest
    timeout-minutes: 65
    strategy:
      fail-fast: false
      matrix:
        api_level: [29, 35, 36]
    steps:
      - name: Checkout exact PR source
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '9.5.0'

      - name: Install Android platform
        run: |
          SDK_ROOT="${ANDROID_HOME:-${ANDROID_SDK_ROOT:-/usr/local/lib/android/sdk}}"
          SDK_MANAGER="$(find "$SDK_ROOT/cmdline-tools" -path '*/bin/sdkmanager' -type f | head -n 1)"
          test -n "$SDK_MANAGER"
          "$SDK_MANAGER" --sdk_root="$SDK_ROOT" --install "platforms;android-37.0" "build-tools;36.0.0"
          echo "ANDROID_HOME=$SDK_ROOT" >> "$GITHUB_ENV"

      - name: Verify Gradle wrapper
        run: |
          echo "497c8c2a7e5031f6aa847f88104aa80a93532ec32ee17bdb8d1d2f67a194a9c7  gradle/wrapper/gradle-wrapper.jar" | sha256sum --check

      - name: Build app and instrumentation APK
        run: ./gradlew :app:assembleDebug :app:assembleDebugAndroidTest --no-daemon --stacktrace

      - name: Enable KVM
        run: |
          if [ -e /dev/kvm ]; then sudo chmod 666 /dev/kvm; fi

      - name: Run Android API ${{ matrix.api_level }} integration QA
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: ${{ matrix.api_level }}
          arch: x86_64
          target: google_apis
          profile: pixel_6
          disable-animations: true
          emulator-boot-timeout: 600
          script: bash .github/scripts/run-petworld-ui10g.sh "${{ matrix.api_level }}"

      - name: Upload source-pinned QA evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: petworld-ui10g-api-${{ matrix.api_level }}
          path: qa/ui10g/api-${{ matrix.api_level }}/
          if-no-files-found: warn
          retention-days: 60
