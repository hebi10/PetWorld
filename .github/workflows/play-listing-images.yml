name: PetWorld Korean Play listing images

on:
  pull_request:
    paths:
      - 'assets/play-store/**'
      - 'scripts/play/listing_images.py'
      - 'scripts/play/tests/test_listing_images.py'
      - '.github/workflows/play-listing-images.yml'
      - 'docs/play-store/listing-images.md'
  workflow_dispatch:
    inputs:
      ops01_release_approved:
        description: 'Explicit Play mutation approval after final QA'
        type: boolean
        required: true
        default: false
      mode:
        description: 'check = offline verification only; upload = Korean image-only Play edit'
        type: choice
        required: true
        default: check
        options: [check, upload]
      confirmation:
        description: 'For upload only, type PETWORLD-KO-LISTING-10'
        required: false
        type: string
        default: ''

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - name: Checkout exact requested source
        uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Run offline regression tests (no Play credentials)
        run: python3 -m unittest discover -s scripts/play/tests -p 'test_listing_images.py' -v
      - name: Check all ten genuine PetWorld image files
        run: python3 scripts/play/listing_images.py --mode check --report output/petworld-listing-check.json
      - name: Save file hash and validation report
        uses: actions/upload-artifact@v4
        with:
          name: petworld-play-images-validated-${{ github.run_id }}
          path: output/petworld-listing-check.json
          if-no-files-found: error
          retention-days: 30
      - name: Confirm safe validation scope
        run: echo 'Validated 1 PetWorld icon + 1 feature graphic + 8 Android screenshots. No Play credentials, edits, AAB builds, track changes, or uploads.' >> "$GITHUB_STEP_SUMMARY"

  upload:
    needs: validate
    if: >-
      github.event_name == 'workflow_dispatch' && inputs.ops01_release_approved == true &&
      (
      github.repository == 'hebi10/PetWorld' &&
      github.ref == 'refs/heads/main' &&
      ((github.event_name == 'workflow_dispatch' &&
        inputs.mode == 'upload' &&
        inputs.confirmation == 'PETWORLD-KO-LISTING-10') ||
       (github.event_name == 'push' &&
        (contains(github.event.head_commit.message, '[petworld-store04-20261111]') ||
         contains(github.event.head_commit.message, '[petworld-ui10h-20261111]'))))
      )
    concurrency:
      group: play-com-haebi-petworld
      cancel-in-progress: false
    runs-on: ubuntu-latest
    timeout-minutes: 20
    environment: google-play
    permissions:
      contents: read
      id-token: write
    steps:
      - name: Checkout exact main commit
        uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
      - name: Require latest verified main source
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          latest="$(gh api "repos/${GITHUB_REPOSITORY}/git/ref/heads/main" --jq .object.sha)"
          test "$latest" = "$GITHUB_SHA"
          test "$(git rev-parse HEAD)" = "$GITHUB_SHA"
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Check Play authentication configuration
        id: credentials
        env:
          PLAY_WORKLOAD_IDENTITY_PROVIDER: ${{ vars.PLAY_WORKLOAD_IDENTITY_PROVIDER }}
          PLAY_SERVICE_ACCOUNT: ${{ vars.PLAY_SERVICE_ACCOUNT }}
          PLAY_SERVICE_ACCOUNT_JSON: ${{ secrets.PLAY_SERVICE_ACCOUNT_JSON }}
        run: python3 scripts/play/preflight.py auth
      - name: Authenticate via Workload Identity Federation
        if: steps.credentials.outputs.auth_mode == 'wif'
        id: wif
        uses: google-github-actions/auth@v3
        with:
          workload_identity_provider: ${{ vars.PLAY_WORKLOAD_IDENTITY_PROVIDER }}
          service_account: ${{ vars.PLAY_SERVICE_ACCOUNT }}
          token_format: access_token
          access_token_scopes: https://www.googleapis.com/auth/androidpublisher
          create_credentials_file: false
      - name: Authenticate via legacy service account JSON
        if: steps.credentials.outputs.auth_mode == 'json'
        id: json
        uses: google-github-actions/auth@v3
        with:
          credentials_json: ${{ secrets.PLAY_SERVICE_ACCOUNT_JSON }}
          token_format: access_token
          access_token_scopes: https://www.googleapis.com/auth/androidpublisher
          create_credentials_file: false
      - name: Validate and replace only PetWorld ko-KR listing images
        env:
          PLAY_LISTING_APPLY: 'true'
          PLAY_ACCESS_TOKEN: ${{ steps.wif.outputs.access_token || steps.json.outputs.access_token }}
          CONFIRMATION: ${{ (github.event_name == 'push' && 'PETWORLD-KO-LISTING-10') || inputs.confirmation }}
        run: |
          python3 scripts/play/listing_images.py \
            --mode upload --confirm "$CONFIRMATION" \
            --report output/petworld-listing-upload.json
      - name: Preserve verified API result
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: petworld-listing-upload-result-${{ github.run_id }}
          path: output/petworld-listing-upload.json
          if-no-files-found: ignore
          retention-days: 30
      - name: Report exact publishing boundary
        if: success()
        run: echo 'PetWorld ko-KR image edit committed and verified by fresh API readback; Play review, public listing visibility, and installation must be confirmed separately. No AAB, track, price, text, or tester changes.' >> "$GITHUB_STEP_SUMMARY"
