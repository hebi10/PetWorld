name: PetWorld isolated Android SDK emulator QA

on:
  pull_request:
    paths:
      - app/src/firebaseDev/**
      - app/src/androidTestFirebaseDev/**/FirebaseDevIsolatedSdkEmulatorTest.kt
      - app/src/main/java/com/haebi/petworld/data/account/**
      - firebase/firestore.rules
      - firebase/package.json
      - firebase/package-lock.json
      - firebase-sdk-qa.json
      - scripts/firebase/prepare_sdk_emulator_qa.py
      - .github/workflows/firebase-isolated-sdk-qa.yml
  workflow_dispatch:

permissions:
  contents: read

jobs:
  isolated-sdk:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - name: Checkout exact source
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
      - name: Install Firebase emulator tooling
        run: npm install --prefix firebase --no-audit --no-fund
      - name: Prepare disposable test-only Android fixture
        env:
          PETWORLD_LOCAL_SDK_QA: 'true'
        run: |
          test ! -f .firebaserc
          test ! -f app/google-services.json
          test ! -f app/src/release/google-services.json
          test ! -f app/src/firebaseDev/google-services.json
          python3 scripts/firebase/prepare_android_config.py firebaseDev
          python3 scripts/firebase/prepare_sdk_emulator_qa.py
      - name: Enable KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
      - name: Run Android SDK against local Auth and Firestore only
        uses: reactivecircus/android-emulator-runner@v2
        env:
          FIREBASE_CLI_DISABLE_TELEMETRY: '1'
        with:
          api-level: 35
          target: google_apis
          arch: x86_64
          profile: pixel_6
          disable-animations: true
          emulator-boot-timeout: 600
          emulator-options: -no-window -gpu swiftshader_indirect -no-snapshot -noaudio -no-boot-anim
          script: ./firebase/node_modules/.bin/firebase emulators:exec --project demo-petworld-sdk-qa --config firebase-sdk-qa.json --only auth,firestore --non-interactive "bash scripts/firebase/run_sdk_emulator_qa.sh"
      - name: Upload test evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: petworld-local-isolated-sdk-qa
          path: |
            app/build/outputs/androidTest-results/connected/**
            app/build/reports/androidTests/connected/**
          if-no-files-found: warn
